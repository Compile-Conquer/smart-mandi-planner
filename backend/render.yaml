services:
  - type: web
    name: mandimitra-ai-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: mandimitra-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://mandimitra-ai.vercel.app

databases:
  - name: mandimitra-db
    region: singapore
    plan: free
    databaseName: mandimitra
    user: mandimitra_user
